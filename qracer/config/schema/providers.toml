# .qracer/providers.toml — provider configuration
# Copy this file to ~/.qracer/providers.toml or ./.qracer/providers.toml

[providers.yfinance]
enabled = true
priority = 100
tier = "hot"
kind = "data"

[providers.claude]
enabled = true
priority = 100
kind = "llm"
api_key_env = "ANTHROPIC_API_KEY"

[providers.openai]
enabled = false
priority = 50
kind = "llm"
api_key_env = "OPENAI_API_KEY"

[providers.gemini]
enabled = false
priority = 50
kind = "llm"
api_key_env = "GOOGLE_API_KEY"

[providers.openrouter]
enabled = false
priority = 50
kind = "llm"
api_key_env = "OPENROUTER_API_KEY"
# Model is chosen at `qracer install` time and stored in config.toml (llm_model).
# Browse available models with `qracer models` or `qracer models --search <kw>`.

[providers.finnhub]
enabled = false
priority = 50
tier = "warm"
kind = "data"
api_key_env = "FINNHUB_API_KEY"

[providers.fred]
enabled = false
priority = 50
tier = "warm"
kind = "data"
api_key_env = "FRED_API_KEY"

[providers.dart]
# OpenDART (금융감독원 전자공시) — Korean listed-company financials & disclosures.
# Ticker = 6-digit KRX stock code (e.g. 005930). Free key: https://opendart.fss.or.kr
enabled = false
priority = 40
tier = "warm"
kind = "data"
api_key_env = "DART_API_KEY"

[providers.kis]
# 한국투자증권 (Korea Investment & Securities) 오픈API — KRX prices + derivatives.
# Price/OHLCV for 6-digit KRX codes (e.g. 005930) plus futures & option chains.
# Needs TWO secrets: appkey + appsecret. https://apiportal.koreainvestment.com
enabled = false
priority = 20
tier = "hot"
kind = "data"
api_key_env = "KIS_APP_KEY"
secret_env = "KIS_SECRET_KEY"
